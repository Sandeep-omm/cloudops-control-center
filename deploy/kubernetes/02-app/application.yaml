apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: job-data
  namespace: cloudops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cloudops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: api
          image: cloudops-control-center:local
          imagePullPolicy: Never
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloudops-secrets
                  key: database-url
            - name: OBJECT_STORAGE_BACKEND
              value: local
            - name: DATA_DIR
              value: /data
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: job-data
              mountPath: /data
      volumes:
        - name: job-data
          persistentVolumeClaim:
            claimName: job-data
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: cloudops
spec:
  selector:
    app: worker
  ports:
    - name: metrics
      port: 8001
      targetPort: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cloudops
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: cloudops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: worker
          image: cloudops-control-center:local
          imagePullPolicy: Never
          command: ["python", "-m", "worker.main"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloudops-secrets
                  key: database-url
            - name: OBJECT_STORAGE_BACKEND
              value: local
            - name: DATA_DIR
              value: /data
          ports:
            - name: metrics
              containerPort: 8001
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: job-data
              mountPath: /data
      volumes:
        - name: job-data
          persistentVolumeClaim:
            claimName: job-data
