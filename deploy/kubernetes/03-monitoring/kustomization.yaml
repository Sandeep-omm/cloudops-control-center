apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudops
resources:
  - monitoring.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
  - name: grafana-datasource
    files:
      - prometheus.yml=grafana-datasource.yml
  - name: grafana-dashboard-provider
    files:
      - provider.yml=grafana-dashboard-provider.yml
  - name: grafana-dashboard
    files:
      - cloudops.json
