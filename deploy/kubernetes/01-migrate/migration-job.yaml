apiVersion: batch/v1
kind: Job
metadata:
  name: cloudops-migrate
  namespace: cloudops
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: cloudops-control-center:local
          imagePullPolicy: Never
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloudops-secrets
                  key: database-url
