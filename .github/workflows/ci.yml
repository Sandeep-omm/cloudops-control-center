name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cloudops_test
          POSTGRES_USER: cloudops_app
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudops_app -d cloudops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cloudops_app:ci-test-password@localhost:5432/cloudops_test
      CLOUDOPS_TEST_DATABASE_URL: postgresql+psycopg://cloudops_app:ci-test-password@localhost:5432/cloudops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Run automated tests
        run: pytest -q
      - name: Lint
        run: ruff check app worker migrations tests
      - name: Compile Python modules
        run: python -m compileall -q app worker migrations tests
      - name: Build container image
        run: docker build -t cloudops-control-center:${{ github.sha }} .

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialize provider plugins
        run: terraform init -backend=false
      - name: Validate configuration
        run: terraform validate
